<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regem — Estoque: as 8 abas no modelo novo (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* MOCKUP das 8 abas do Estoque depois de "Produtos" — Fichas técnicas, Contagem, Compras, Recebimento,
   Validades, Etiquetas, Desperdício e Vistorias — no mesmo modelo aprovado em Produtos. Aprovado pelo dono
   em 07/10/2026 ("implementar as sugestões, protótipos aprovados").
   Dados inventados; nada aqui fala com o Regem. O que toda aba passa a ter:
   (1) título com a CONTAGEM da lista ("3 de 12 fichas"); (2) situações com a quantidade de cada uma, que
   também filtram; (3) busca e filtros; (4) lista em tabela (cartões no celular) com as ações na linha;
   (5) criar/editar numa GAVETA lateral e confirmar/conferir num diálogo — nada abre no topo da página.
   Onde a tela real difere, de propósito:
   - os FORMULÁRIOS daqui são resumidos. Os de verdade mantêm todos os campos que já existiam — na
     ficha técnica, por exemplo: custos de delivery, CMV de delivery, preço sugerido, markup e margem;
   - a lista vira cartões abaixo de 1280 px, e a ação secundária da linha mostra só o ícone (com o
     nome ao passar o mouse) abaixo de 1536 px; a ação principal mostra o texto sempre;
   - o período (7/30/90 dias, todo o período) é cortado no SERVIDOR; aqui é só um filtro da amostra. */
:root{
  --bg:#F1F4F8; --card:#FFFFFF; --ink:#132536; --ink-2:#43586C; --line:#DEE5EC; --line-2:#C8D2DC;
  --gold:#E8A845; --on-gold:#281B06; --navy:#0F2230; --ok:#0F6647; --ok-bg:#E3F4EC; --crit:#B93232; --crit-bg:#FBE9E9;
  --warn:#9A4B1C; --warn-bg:#FCEDE4; --info:#2C6699; --info-bg:#E6F0F8; --radius:12px;
  --display:'Archivo',sans-serif; --body:'Figtree',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #3A7FB8;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.lado{background:var(--navy);color:#C9D6E2;padding:16px 10px}
.lado .marca{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff;font-family:var(--display);font-weight:700;font-size:18px}
.lado .marca svg{width:30px;height:30px}
.lado a{display:block;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:600;font-size:14px}
.lado a[aria-current]{background:rgba(232,168,69,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
main{min-width:0;padding:20px 24px 80px}
.trilha{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9A6A12}
h1{font-family:var(--display);font-size:26px;margin:2px 0 14px}
.abas{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.aba{flex:none;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap}
.aba:hover{border-color:var(--ink-2);color:var(--ink)}
.aba[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.barra{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.barra h2{font-family:var(--display);font-size:20px;margin:0}
.resumo{color:var(--ink-2);font-size:13.5px;margin:2px 0 0}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.bt:hover{border-color:var(--ink-2)}
.bt.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.bt.perigo{background:var(--crit);border-color:var(--crit);color:#fff}
.bt[disabled]{opacity:.5;cursor:not-allowed}
/* situações: a quantidade de cada uma, e clicar filtra */
.sits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sit{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14px;color:var(--ink-2)}
.sit b{font-family:var(--mono);font-size:13px;background:#EEF2F6;color:var(--ink);border-radius:999px;padding:1px 8px}
.sit[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.sit[aria-pressed="true"] b{background:rgba(255,255,255,.18);color:#fff}
.sit.crit b{background:var(--crit-bg);color:var(--crit)} .sit.warn b{background:var(--warn-bg);color:var(--warn)}
.sit[aria-pressed="true"].crit b,.sit[aria-pressed="true"].warn b{background:rgba(255,255,255,.18);color:#fff}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.filtros .larga{grid-column:span 2}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label,.rot{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.campo input,.campo select,.campo textarea{min-height:40px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:#fff;width:100%}
.campo textarea{padding:8px 12px;min-height:64px}
.ajuda{font-size:12.5px;color:var(--ink-2)}
.tabela{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--ink-2);background:#F7F9FB;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFD}
.nome{font-weight:700}
.sub{font-size:12.5px;color:var(--ink-2)}
.num{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.selo{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap}
.selo.ok{background:var(--ok-bg);color:var(--ok)} .selo.crit{background:var(--crit-bg);color:var(--crit)}
.selo.info{background:var(--info-bg);color:var(--info)} .selo.warn{background:var(--warn-bg);color:var(--warn)} .selo.neutro{background:#EEF2F6;color:var(--ink-2)}
.linha-acoes{display:flex;gap:4px;justify-content:flex-end}
.ic{display:inline-flex;align-items:center;gap:6px;min-width:40px;min-height:40px;justify-content:center;border-radius:10px;border:1px solid transparent;background:transparent;padding:0 9px;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.ic:hover{background:#EEF2F6;border-color:var(--line-2);color:var(--ink)}
.ic.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.ic.perigo:hover{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.vazio{padding:36px 16px;text-align:center;color:var(--ink-2)}
.nota{border-left:4px solid var(--info);background:var(--info-bg);padding:10px 12px;border-radius:8px;font-size:14px}
.nota.crit{border-color:var(--crit);background:var(--crit-bg)}
.fundo{position:fixed;inset:0;background:rgba(15,34,48,.45);z-index:40}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(15,34,48,.18)}
.gaveta.larga{width:min(980px,100%)}
.painel header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.painel h3{font-family:var(--display);font-size:19px;margin:0}
.painel .corpo{flex:1;overflow-y:auto;padding:16px 20px;display:grid;gap:14px;align-content:start;min-height:0}
.painel footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#F7F9FB}
.dialogo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--card);z-index:50;border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,34,48,.3)}
.dialogo.largo{width:min(940px,calc(100% - 24px))}
.dialogo footer{border-radius:0 0 16px 16px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:13px;color:var(--ink-2)}
.ficha[aria-pressed="true"]{background:#FFF4DF;border-color:var(--gold);color:#6B4505}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{min-height:40px;border:none;background:#fff;font-weight:600;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.escolha{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow-y:auto}
.escolha label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:44px}
.escolha label:last-child{border-bottom:none}
.escolha input[type=number]{width:84px;min-height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px}
.mini td,.mini th{padding:7px 10px}
.mini input,.mini select{min-height:38px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;width:100%;min-width:64px;background:#fff}
.conta{background:var(--info-bg);color:var(--info);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.custo{border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.custo .l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cmv{background:#F7F9FB;border-radius:10px;padding:12px;text-align:center}
.cmv .v{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--crit)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
@media (max-width:1000px){ .app{grid-template-columns:1fr} .lado{display:none} main{padding:16px 16px 80px} }
@media (max-width:1279px){
  main .tabela.cartoes{border:none;background:none;overflow:visible} main .cartoes thead{display:none}
  main .cartoes tbody tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
  main .cartoes td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:none;padding:4px 0}
  main .cartoes td::before{content:attr(data-rot);flex:none;font-size:12.5px;font-weight:700;color:var(--ink-2)}
  main .cartoes td .v{text-align:right;min-width:0}
  main .cartoes td.c-nome{display:block} main .cartoes td.c-nome .v{text-align:left} main .cartoes td.c-nome::before,main .cartoes td.c-acoes::before{content:none}
  main .cartoes td.c-acoes{margin-top:8px} main .linha-acoes{width:100%;flex-wrap:wrap;justify-content:stretch} main .linha-acoes .ic{flex:1;border-color:var(--line-2)}
}
@media (min-width:700px) and (max-width:1279px){
  main .cartoes table,main .cartoes tbody{display:block} main .cartoes tbody{display:grid;grid-template-columns:1fr 1fr;gap:10px} main .cartoes tbody tr{margin:0}
}
@media (max-width:820px){
  .filtros{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))} .filtros .larga{grid-column:1 / -1} .duas{grid-template-columns:1fr} .gaveta.larga .dois-lados{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<div class="app">
  <nav class="lado" aria-label="Menu principal">
    <div class="marca"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="29" fill="none" stroke="#E2A340" stroke-width="4.5"/><path d="M33 28V54M33 28H42A7.5 7 0 0 1 42 42H33M36 42L49 54" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60.5" cy="19.5" r="5.5" fill="#F2C277"/></svg>Regem</div>
    <a href="#">Dashboard</a><a href="#">PDV · Balcão</a><a href="#">Delivery</a><a href="#">Tarefas</a><a href="#">Escalas</a>
    <a href="#" aria-current="page">Estoque</a><a href="#">Ponto de baixa (QR)</a><a href="#">Checklist &amp; registros</a><a href="#">Financeiro</a><a href="#">Cadastros</a><a href="#">Configurações</a>
  </nav>
  <main>
    <div class="trilha">Insumos &amp; produção</div>
    <h1>Estoque</h1>
    <div class="abas" id="abas" role="group" aria-label="Seções do estoque"></div>
    <div id="conteudo"></div>
  </main>
</div>
<div class="fundo" id="fundo" hidden></div>
<div id="painel"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const HOJE = new Date('2026-10-07T12:00:00');
const dt = (s) => new Date(s + 'T12:00:00');
const br = (s) => (s ? s.slice(8, 10) + '/' + s.slice(5, 7) + (s.slice(0, 4) !== '2026' ? '/' + s.slice(0, 4) : '') : '—');
const dias = (s) => Math.round((dt(s) - HOJE) / 864e5);
const brl = (n) => Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = (n) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const sem = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const selo = (cls, t) => `<span class="selo ${cls}">${t}</span>`;
function avisar(t) { const x = $('#toast'); x.textContent = t; x.hidden = false; clearTimeout(avisar.t); avisar.t = setTimeout(() => (x.hidden = true), 2800); }
const PERIODOS = [['7', 'Últimos 7 dias'], ['30', 'Últimos 30 dias'], ['90', 'Últimos 90 dias'], ['', 'Todo o período']];
const noPeriodo = (data, p) => !p || dias(data) >= -Number(p);
const FORN = ['Atacado Central', 'Distribuidora Boa Vista', 'Hortifruti da Serra', 'Verdes do Sítio', 'Frios & Cia'];
const PESSOAS = ['Ana', 'Carlos', 'Marina'];
const PRODUTOS = [['Refrigerante cola lata 350 ml', 'Bebidas', 'fardo', 3, 5], ['Refrigerante uva lata 350 ml', 'Bebidas', 'fardo', 16, 5], ['Guaraná copo 290 ml', 'Bebidas', 'caixa', 19, 5], ['Queijo muçarela peça', 'Laticínios', 'kg', 11.6, 5], ['Presunto fatiado', 'Laticínios', 'kg', 2, 3], ['Alface', 'Hortifruti', 'saco', 3, 8], ['Tomate', 'Hortifruti', 'kg', 6, 4], ['Pão brioche', 'Padaria', 'unidade', 40, 60], ['Batata palito congelada', 'Congelados', 'pacote', 0, 6], ['Embalagem hambúrguer kraft', 'Embalagens', 'pacote', 0, 4], ['Molho de tomate', 'Mercearia', 'lata', 12, 6], ['Detergente neutro 5 L', 'Limpeza', 'galão', 2, 1]];
const META = 31.5;

// ══ as 8 abas ═══════════════════════════════════════════════════════════════════════════════
const ABAS = {
  fichas: {
    aba: 'Fichas técnicas', titulo: 'Fichas técnicas', um: 'ficha', varios: 'fichas', novo: '＋ Nova ficha',
    dados: [
      { nome: 'X-burger da casa', cat: 'Prato do cardápio', rend: '1 porção', custo: 9.84, preco: 32, sub: false },
      { nome: 'Combo burger + fritas', cat: 'Prato do cardápio', rend: '1 porção', custo: 15.3, preco: 44.9, sub: true },
      { nome: 'Batata frita porção', cat: 'Prato do cardápio', rend: '1 porção', custo: 6.2, preco: 22, sub: false },
      { nome: 'Molho base de tomate', cat: 'Base / pré-preparo', rend: '10 porções', custo: 1.12, preco: null, sub: false },
      { nome: 'Maionese verde', cat: 'Base / pré-preparo', rend: '20 porções', custo: 0.86, preco: null, sub: false },
      { nome: 'Milk-shake de chocolate', cat: 'Drink / coquetel', rend: '1 porção', custo: 5.9, preco: 16, sub: false },
      { nome: 'Caipirinha', cat: 'Drink / coquetel', rend: '1 porção', custo: 4.1, preco: 18, sub: false },
      { nome: 'Brownie com sorvete', cat: 'Sobremesa', rend: '1 porção', custo: 7.45, preco: 19.9, sub: true },
    ].map((f) => ({ ...f, cmv: f.preco ? Math.round((f.custo / f.preco) * 1000) / 10 : null })),
    texto: (r) => r.nome,
    sits: [['Dentro da meta', (r) => r.cmv != null && r.cmv <= META, ''], ['Acima da meta', (r) => r.cmv != null && r.cmv > META, 'crit'], ['Sem preço', (r) => r.cmv == null, 'warn']],
    selects: [['Categoria', 'Todas as categorias', (r) => r.cat], ['Sub-receita', 'Com e sem sub-receita', (r) => (r.sub ? 'Usa sub-receita' : 'Não usa')]],
    resumo: () => `meta de CMV ${String(META).replace('.', ',')}%`,
    colunas: [
      ['Ficha', (r) => `<div class="nome">${r.nome}</div><div class="sub">${r.cat}${r.sub ? ' · usa sub-receita' : ''}</div>`],
      ['Rendimento', (r) => r.rend],
      ['Custo por porção', (r) => `<span class="num">${brl(r.custo)}</span>`],
      ['Preço de venda', (r) => (r.preco ? `<span class="num">${brl(r.preco)}</span>` : '—')],
      ['CMV', (r) => (r.cmv == null ? selo('warn', 'sem preço') : selo(r.cmv <= META ? 'ok' : 'crit', `<span class="num">${String(r.cmv).replace('.', ',')}%</span>`))],
    ],
    acoes: () => [['⧉', 'Duplicar', 'duplicar'], ['✎', 'Editar', 'editar'], ['🗑', 'Excluir', 'excluir', 'perigo']],
    aoNovo: () => editorFicha(null),
    aoAcao: (k, r) => (k === 'editar' ? editorFicha(r) : k === 'duplicar' ? (avisar(`"${r.nome}" duplicada — abra a cópia para ajustar.`)) : confirmarExcluir(r, 'A ficha sai desta lista e deixa de ser opção de sub-receita e de etiqueta. O produto do cardápio que a usa continua à venda, mas deixa de dar baixa nos ingredientes dela; as fichas que a usam como sub-receita também deixam de consumi-los.')),
  },
  contagem: {
    aba: 'Contagem', titulo: 'Contagem', um: 'lista', varios: 'listas', novo: '＋ Nova lista',
    dados: [
      { nome: 'Bebidas — fechamento', rec: 'Diária', quando: 'todo dia · 23:00', itens: 12, resp: 'Carlos', ultima: '2026-10-06', hoje: true },
      { nome: 'Câmara fria', rec: 'Semanal', quando: 'quarta · 09:00', itens: 18, resp: 'Ana', ultima: '2026-09-30', hoje: true },
      { nome: 'Contagem geral', rec: 'Semanal', quando: 'segunda · 08:00', itens: 42, resp: '', ultima: '2026-10-05', hoje: false },
      { nome: 'Inventário do mês', rec: 'Mensal', quando: 'dia 1 · 07:00', itens: 96, resp: 'Marina', ultima: '2026-10-01', hoje: false },
      { nome: 'Embalagens', rec: 'Avulsa', quando: 'sem dia marcado', itens: 9, resp: '', ultima: null, hoje: false },
    ],
    texto: (r) => r.nome,
    sits: [['Para hoje', (r) => r.hoje, 'warn'], ['Em dia', (r) => !r.hoje && r.ultima, ''], ['Nunca contada', (r) => !r.ultima, 'crit']],
    selects: [['Recorrência', 'Todas as recorrências', (r) => r.rec], ['Responsável', 'Todos os responsáveis', (r) => r.resp || 'Sem responsável']],
    resumo: (l) => `${l.reduce((s, r) => s + r.itens, 0)} produtos nas listas`,
    colunas: [
      ['Lista', (r) => `<div class="nome">${r.nome} ${r.hoje ? selo('warn', 'hoje') : ''}</div><div class="sub">${r.rec} · ${r.quando}</div>`],

// ══ painéis (gaveta e diálogo): foco entra, fica preso, Esc fecha, foco volta ═══════════════
let aberto = null, quemAbriu = null;
function painel({ titulo, corpo, rodape, tipo = 'dialogo', largo = false, alerta = false, foco }) {
  if (aberto) fechar();
  quemAbriu = document.activeElement;
  $('#painel').innerHTML = `<div class="painel ${tipo === 'gaveta' ? 'gaveta' + (largo ? ' larga' : '') : 'dialogo' + (largo ? ' largo' : '')}" role="${alerta ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="pTit">
    <header><h3 id="pTit">${titulo}</h3><button class="ic" data-fechar aria-label="Fechar">✕</button></header><div class="corpo">${corpo}</div><footer>${rodape}</footer></div>`;
  aberto = $('#painel').firstElementChild; $('#fundo').hidden = false;
  (foco ? $(foco, aberto) : $('.corpo input, .corpo select, .corpo textarea', aberto) || $('footer button', aberto))?.focus();
}
function fechar() { if (!aberto) return; $('#painel').innerHTML = ''; aberto = null; $('#fundo').hidden = true; if (quemAbriu && document.contains(quemAbriu)) quemAbriu.focus(); }
document.addEventListener('keydown', (e) => {
  if (!aberto) return;
  if (e.key === 'Escape') return fechar();
  if (e.key !== 'Tab') return;
  const f = [...aberto.querySelectorAll('button,input,select,textarea')].filter((x) => !x.disabled && x.offsetParent !== null);
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
const campo = (rot, html, ajuda = '') => `<div class="campo"><label>${rot}</label>${html}${ajuda ? `<span class="ajuda">${ajuda}</span>` : ''}</div>`;
const sel = (ops, v = '') => `<select>${ops.map((o) => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
const rodapeSalvar = (t, msg) => `<button class="bt" data-fechar>Cancelar</button><button class="bt pri" onclick="fechar();avisar('${msg}')">${t}</button>`;
function confirmar(titulo, corpo, botao, fn) {
  painel({ titulo, corpo, alerta: true, rodape: `<button class="bt" data-fechar>Cancelar</button><button class="bt pri" id="bOk">${botao}</button>`, foco: 'footer button' });

}

}

  painel({ tipo: 'gaveta', titulo: 'Gerar etiqueta de validade', rodape: rodapeSalvar('Gerar e imprimir', 'Etiqueta(s) enviada(s) à impressão.'),
    corpo: `${campo('O que vai ser etiquetado', sel(['Molho da casa (ficha)', 'Queijo fatiado (produto)', 'Alface — lote de 06/10', 'Bacon em cubos (produto)']), 'Produtos do cardápio com validade, fichas, produtos do estoque e lotes recebidos.')}
      <div><div class="rot" style="margin-bottom:4px">Situação</div><div class="seg"><button type="button" aria-pressed="true">Novo (fechado)</button><button type="button" aria-pressed="false">Já em uso</button></div></div>
      <div class="duas">${campo('Quantidade de etiquetas', '<input type="number" min="1" value="1">')}${campo('Manipulado em', '<input type="date" value="2026-10-07">')}</div>
      <div class="nota">Validade calculada: <b>10/10</b> (3 dias). O desenho sai no modelo escolhido na aba Modelo.</div>` });
}
function dialogoPerda(r) {
  painel({ titulo: `Perda: ${r.nome}`, alerta: true, rodape: `<button class="bt" data-fechar>Cancelar</button><button class="bt perigo" id="bPerda">Registrar perda</button>`,
    corpo: `<p style="margin:0">A etiqueta <span class="num">#${r.cod}</span> venceu em ${br(r.val)}.</p>${campo('Quanto foi perdido? (opcional)', '<input type="number" min="0" step="any" placeholder="ex.: 0,5">', 'Com a quantidade, a perda baixa o estoque. Sem ela, fica só o registro.')}` });
  $('#bPerda').onclick = () => { ABAS.etiquetas.dados = ABAS.etiquetas.dados.filter((x) => x !== r); fechar(); desenhar(); avisar('Perda registrada.'); };
}
function formDesperdicio(lote) {
  painel({ tipo: 'gaveta', titulo: 'Registrar desperdício', rodape: rodapeSalvar('Registrar desperdício', 'Desperdício registrado.'),
    corpo: `${campo('Descrição', `<input value="${lote ? lote.nome + ' vencido' : ''}" placeholder="Ex.: Pão queimado">`)}
      ${campo('Produto do estoque (opcional)', sel(['— sem vínculo (só registro) —', ...PRODUTOS.map((p) => p[0])], lote ? lote.nome : ''), 'Com o produto, baixa o estoque e entra no CMV.')}
      <div class="duas">${campo('Quantidade', `<input type="number" min="0" step="any" value="${lote ? lote.qtd : ''}" placeholder="0">`)}${campo('Motivo', sel(['Validade', 'Preparo', 'Queda', 'Transporte', 'Outro'], lote ? 'Validade' : 'Preparo'))}</div>
      <div class="duas">${campo('Data', '<input type="date" value="2026-10-07">')}${campo('Foto (opcional)', '<input type="file" accept="image/*" style="padding:8px">')}</div>` });
}
function formVistoria() {
  painel({ tipo: 'gaveta', titulo: 'Registrar vistoria', rodape: rodapeSalvar('Registrar vistoria', 'Vistoria registrada.'),
    corpo: `<div><div class="rot" style="margin-bottom:4px">Tipo</div><div class="seg"><button type="button" aria-pressed="true">Abertura</button><button type="button" aria-pressed="false">Fechamento</button><button type="button" aria-pressed="false">Padrão</button></div></div>
      ${campo('Observação', '<textarea placeholder="Ex.: Tudo em ordem"></textarea>')}
      <div class="duas">${campo('Data', '<input type="date" value="2026-10-07">')}${campo('Foto (opcional)', '<input type="file" accept="image/*" style="padding:8px">')}</div>` });
}
desenhar();
</script>
</body>
</html>
