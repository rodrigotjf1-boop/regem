<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regem — Configurações no modelo novo (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* MOCKUP das telas do menu Configurações — Loja, Unidades, Produção & KDS, Alertas do KDS,
   Direcionamento do catálogo, Equipamentos, Impressoras e cupons, Config. por ramo, Planos & assinatura,
   Acessos & perfis, Aplicativos conectados e Servidor local — e de Pedidos de produção (menu Tarefas), no
   mesmo modelo aprovado no Estoque. Aprovado pelo dono em 07/10/2026 ("protótipo pode"), com quatro
   respostas: Unidades sem as colunas de setores e pessoas; "Configurar" em todo equipamento que tem o que
   configurar; "Imprimir teste" na linha das impressoras; Ordens de produção fica só no menu Tarefas.
   Nada aqui fala com o Regem e os dados são inventados.
   O que toda tela passa a ter:
   (1) título com a CONTAGEM do que ela lista ("3 de 12 equipamentos", "14 ajustes em 4 grupos");
   (2) situações com a quantidade de cada uma, que também filtram;
   (3) busca e filtros — inclusive nas telas de ajuste ("buscar ajuste");
   (4) lista em tabela (cartões no celular) com as ações na linha;
   (5) criar/editar numa GAVETA lateral e confirmar num diálogo — nada abre no topo da página e
       nenhuma pergunta usa a janela do navegador;
   (6) nas telas de ajuste: os ajustes em grupos, a quantidade de alterações ainda não salvas e uma
       barra fixa de "Salvar alterações" (hoje cada tela salva de um jeito).
   Onde a tela real difere, de propósito:
   - os FORMULÁRIOS e os grupos de ajuste daqui são resumidos: os de verdade mantêm todos os campos
     que já existem hoje;
   - no celular o menu lateral some e aparece o seletor "Tela" no topo — no aplicativo é o menu ☰;
   - a lista vira cartões abaixo de 1280 px. */
:root{
  --bg:#F1F4F8; --card:#FFFFFF; --ink:#132536; --ink-2:#43586C; --line:#DEE5EC; --line-2:#C8D2DC;
  --gold:#E8A845; --on-gold:#281B06; --navy:#0F2230; --ok:#0F6647; --ok-bg:#E3F4EC; --crit:#B93232; --crit-bg:#FBE9E9;
  --warn:#9A4B1C; --warn-bg:#FCEDE4; --info:#2C6699; --info-bg:#E6F0F8; --radius:12px;
  --display:'Archivo',sans-serif; --body:'Figtree',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #3A7FB8;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.lado{background:var(--navy);color:#C9D6E2;padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.lado .marca{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;color:#fff;font-family:var(--display);font-weight:700;font-size:18px}
.lado .marca svg{width:30px;height:30px}
.lado .item{display:block;padding:8px 12px;border-radius:10px;color:inherit;font-weight:600;font-size:14px}
.lado .grupo-menu{margin-top:2px;padding:8px 12px 4px;color:#fff;font-weight:700;font-size:14px}
.lado button.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:36px;text-align:left;border:none;background:transparent;color:inherit;padding:6px 10px 6px 26px;border-radius:10px;font-weight:600;font-size:13.5px}
.lado button.sub:hover{background:rgba(255,255,255,.06);color:#fff}
.lado button.sub[aria-current="page"]{background:rgba(232,168,69,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.lado button.sub i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:#9FB2C4}
main{min-width:0;padding:20px 24px 110px}
.trilha{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A5209}
h1{font-family:var(--display);font-size:26px;margin:2px 0 14px}
.campo.so-celular{display:none;margin-bottom:14px}
.abas{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.aba{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-weight:600;font-size:14px;white-space:nowrap}
.aba:hover{border-color:var(--ink-2);color:var(--ink)}
.aba b{font-family:var(--mono);font-size:12.5px;background:#EEF2F6;color:var(--ink);border-radius:999px;padding:1px 8px}
.aba[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.aba[aria-pressed="true"] b{background:rgba(40,27,6,.14);color:var(--on-gold)}
.barra{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.barra h2{font-family:var(--display);font-size:20px;margin:0}
.resumo{color:var(--ink-2);font-size:13.5px;margin:2px 0 0}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14px;white-space:nowrap}
.bt:hover{border-color:var(--ink-2)}
.bt.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.bt.perigo{background:var(--crit);border-color:var(--crit);color:#fff}
.bt[disabled]{opacity:.5;cursor:not-allowed}
.sits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sit{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14px;color:var(--ink-2)}
.sit b{font-family:var(--mono);font-size:13px;background:#EEF2F6;color:var(--ink);border-radius:999px;padding:1px 8px}
.sit[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.sit[aria-pressed="true"] b{background:rgba(255,255,255,.18);color:#fff}
.sit.crit b{background:var(--crit-bg);color:var(--crit)} .sit.warn b{background:var(--warn-bg);color:var(--warn)}
.sit[aria-pressed="true"].crit b,.sit[aria-pressed="true"].warn b{background:rgba(255,255,255,.18);color:#fff}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.filtros .larga{grid-column:span 2}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo label,.rot{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.campo input,.campo select,.campo textarea{min-height:40px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:#fff;width:100%}
.campo textarea{padding:8px 12px;min-height:64px}
.ajuda{font-size:12.5px;color:var(--ink-2)}
.tabela{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--ink-2);background:#F7F9FB;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFD}
.nome{font-weight:700}
.sub-t{font-size:12.5px;color:var(--ink-2)}
.num{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.selo{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap}
.selo.ok{background:var(--ok-bg);color:var(--ok)} .selo.crit{background:var(--crit-bg);color:var(--crit)}
.selo.info{background:var(--info-bg);color:var(--info)} .selo.warn{background:var(--warn-bg);color:var(--warn)} .selo.neutro{background:#EEF2F6;color:var(--ink-2)}
.linha-acoes{display:flex;gap:4px;justify-content:flex-end}
.ic{display:inline-flex;align-items:center;gap:6px;min-width:40px;min-height:40px;justify-content:center;border-radius:10px;border:1px solid transparent;background:transparent;padding:0 9px;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.ic:hover{background:#EEF2F6;border-color:var(--line-2);color:var(--ink)}
.ic.pri{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.ic.perigo:hover{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.vazio{padding:36px 16px;text-align:center;color:var(--ink-2)}
.nota{border-left:4px solid var(--info);background:var(--info-bg);padding:10px 12px;border-radius:8px;font-size:14px}
.nota.crit{border-color:var(--crit);background:var(--crit-bg)} .nota.warn{border-color:var(--warn);background:var(--warn-bg)} .nota.ok{border-color:var(--ok);background:var(--ok-bg)}
/* telas de ajuste: grupos, linha de ajuste, chave liga/desliga, barra de salvar */
.grupo{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.grupo > header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.grupo > header h3{font-family:var(--display);font-size:16px;margin:0}
.grupo > header span{font-size:12.5px;color:var(--ink-2)}
.aj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:6px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.aj:last-child{border-bottom:none}
.aj .rot-aj{font-weight:600}
.aj .ajuda{display:block;margin-top:1px}
.aj.mudou{background:#FFF9EC;box-shadow:inset 3px 0 0 var(--gold)}
.aj .ctrl{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.aj .ctrl input,.aj .ctrl select{min-height:40px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:#fff;width:100%;min-width:0}
.aj .ctrl .suf{font-size:13px;color:var(--ink-2);white-space:nowrap}
.liga{position:relative;flex:none;width:52px;height:40px;border:none;background:transparent;padding:0}
.liga::before{content:"";position:absolute;left:2px;right:2px;top:8px;bottom:8px;border-radius:999px;background:#B4C0CC;transition:background .15s}
.liga::after{content:"";position:absolute;left:5px;top:11px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.liga[aria-checked="true"]::before{background:var(--ok)}
.liga[aria-checked="true"]::after{transform:translateX(24px)}
.liga-txt{font-size:13px;font-weight:700;color:var(--ink-2);min-width:68px;text-align:right}
.barra-salvar{position:fixed;left:248px;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 24px;background:var(--navy);color:#fff;box-shadow:0 -8px 24px rgba(15,34,48,.2)}
.barra-salvar .bt{border-color:rgba(255,255,255,.35);background:transparent;color:#fff}
.barra-salvar .bt.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.cartoes-plano{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.plano{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:8px;align-content:start}
.plano.atual{border:2px solid var(--gold)}
.plano h3{font-family:var(--display);margin:0;font-size:17px}
.plano .preco{font-family:var(--mono);font-size:22px;font-weight:700}
.plano ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .rot{display:block}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:700}
.passos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:0;list-style:none}
.passos li{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:14px;color:var(--ink-2)}
.passos li b{font-family:var(--mono);font-size:12.5px;background:#EEF2F6;border-radius:999px;padding:1px 8px;color:var(--ink)}
.passos li[aria-current]{background:var(--navy);border-color:var(--navy);color:#fff} .passos li[aria-current] b{background:rgba(255,255,255,.18);color:#fff}
.passos li.feito b{background:var(--ok-bg);color:var(--ok)}
.matriz td,.matriz th{padding:8px 10px;text-align:center} .matriz td:first-child,.matriz th:first-child{text-align:left}
.matriz input[type=checkbox]{width:20px;height:20px;accent-color:#0F6647}
.fundo{position:fixed;inset:0;background:rgba(15,34,48,.45);z-index:40}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(15,34,48,.18)}
.gaveta.larga{width:min(1080px,100%)}
.painel header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.painel h3{font-family:var(--display);font-size:19px;margin:0}
.painel .corpo{flex:1;overflow-y:auto;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-height:0}
.painel .corpo > *{min-width:0}
.painel footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#F7F9FB}
.dialogo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--card);z-index:50;border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,34,48,.3)}
.dialogo.largo{width:min(940px,calc(100% - 24px))}
.dialogo footer{border-radius:0 0 16px 16px}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:13px;color:var(--ink-2)}
.ficha[aria-pressed="true"]{background:#FFF4DF;border-color:var(--gold);color:#6B4505}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg{grid-auto-columns:minmax(0,1fr)}
.seg button{min-height:40px;border:none;background:#fff;font-weight:600;border-right:1px solid var(--line-2);padding:6px 8px;line-height:1.2}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.mini td,.mini th{padding:7px 10px}
.codigo{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.18em;background:#F7F9FB;border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px;text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
@media (max-width:1000px){ .app{grid-template-columns:1fr} .lado{display:none} main{padding:16px 16px 120px} .campo.so-celular{display:flex} .barra-salvar{left:0;padding:10px 16px} }
@media (max-width:1279px){
  main .tabela.cartoes{border:none;background:none;overflow:visible} main .cartoes thead{display:none}
  main .cartoes tbody tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
  main .cartoes td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:none;padding:4px 0}
  main .cartoes td::before{content:attr(data-rot);flex:none;font-size:12.5px;font-weight:700;color:var(--ink-2)}
  main .cartoes td .v{text-align:right;min-width:0}
  main .cartoes td.c-nome{display:block} main .cartoes td.c-nome .v{text-align:left} main .cartoes td.c-nome::before,main .cartoes td.c-acoes::before{content:none}
  main .cartoes td.c-acoes{margin-top:8px} main .linha-acoes{width:100%;flex-wrap:wrap;justify-content:stretch} main .linha-acoes .ic{flex:1;border-color:var(--line-2)}
}
@media (min-width:1280px) and (max-width:1535px){ main .cartoes .ic:not(.pri) .rt{display:none} }
@media (min-width:700px) and (max-width:1279px){
  main .cartoes table,main .cartoes tbody{display:block} main .cartoes tbody{display:grid;grid-template-columns:1fr 1fr;gap:10px} main .cartoes tbody tr{margin:0}
}
@media (max-width:820px){
  .filtros{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))} .filtros .larga{grid-column:1 / -1} .duas{grid-template-columns:minmax(0,1fr)}
  .aj{grid-template-columns:minmax(0,1fr)!important} .aj .ctrl{justify-content:flex-start} .gaveta.larga .dois-lados{grid-template-columns:minmax(0,1fr)!important}
  .filtros[style]{grid-template-columns:minmax(0,1fr)!important}
}
</style>
</head>
<body>
<div class="app">
  <nav class="lado" aria-label="Menu principal">
    <div class="marca"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="29" fill="none" stroke="#E2A340" stroke-width="4.5"/><path d="M33 28V54M33 28H42A7.5 7 0 0 1 42 42H33M36 42L49 54" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60.5" cy="19.5" r="5.5" fill="#F2C277"/></svg>Regem</div>
    <span class="item">Dashboard</span><span class="item">PDV · Balcão</span><span class="item">Delivery</span>
    <div class="grupo-menu">Tarefas</div>
    <div id="menuTarefas"></div>
    <span class="item">Estoque</span><span class="item">Financeiro</span><span class="item">Cadastros</span>
    <div class="grupo-menu">Configurações</div>
    <div id="menu"></div>
    <span class="item" style="margin-top:6px">Relatórios</span>
  </nav>
  <main>
    <div class="trilha" id="trilha">Configurações</div>
    <h1 id="tituloTela"></h1>
    <div class="campo so-celular"><label for="irPara">Tela (no aplicativo: menu ☰)</label><select id="irPara"></select></div>
    <div class="abas" id="secoes" role="group" aria-label="Partes desta tela" hidden></div>
    <div id="conteudo"></div>
  </main>
</div>
<div class="barra-salvar" id="barraSalvar" hidden></div>
<div class="fundo" id="fundo" hidden></div>
<div id="painel"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
// ══ motor do protótipo ══════════════════════════════════════════════════════════════════════
// Cada tela do menu tem uma ou mais PARTES; cada parte é de um destes tipos:
//   lista   — título com contagem, situações com quantidade, busca e filtros, ações na linha;
//   ajustes — ajustes em grupos, com busca, contagem e a barra "N alterações ainda não salvas";
//   livre   — telas que não são lista nem ajuste (planos, assistente, saúde do servidor).
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sem = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const selo = (cls, t) => `<span class="selo ${cls}">${t}</span>`;
const brl = (n) => Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = (n) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
function avisar(t) { const x = $('#toast'); x.textContent = t; x.hidden = false; clearTimeout(avisar.t); avisar.t = setTimeout(() => (x.hidden = true), 3200); }

const TELAS = {};
const ORDEM = ['loja', 'unidades', 'producao', 'alertas', 'direcionamento', 'equipamentos', 'impressao', 'ordens', 'ramo', 'planos', 'acessos', 'aplicativos', 'servidor'];
let atual = 'equipamentos', sec = 0;
const estado = {};
const est = () => (estado[atual + '/' + sec] ||= { busca: '', sit: -1, sel: {}, vals: {}, marc: new Set() });
const S = () => TELAS[atual].secoes[sec];
const itensAj = (s) => s.grupos.flatMap((g) => g.itens);
const valorAj = (it, e) => (it.id in e.vals ? e.vals[it.id] : it.v);
const mudouAj = (it, e) => it.id in e.vals && e.vals[it.id] !== it.v;
const pendentes = () => (S().tipo === 'ajustes' ? itensAj(S()).filter((it) => mudouAj(it, est())).length : 0);
const contaDe = (s) => (typeof s.conta === 'function' ? s.conta() : s.tipo === 'lista' ? s.dados.length : s.tipo === 'ajustes' ? itensAj(s).length : null);
const valores = (f, r) => { const v = f[2](r); return (Array.isArray(v) ? v : [v]).filter((x) => x !== '' && x != null); };

function irPara(tela, parte, semPerguntar) {
  const n = pendentes();
  if (n && !semPerguntar && (tela !== atual || parte !== sec)) {
    return confirmar('Sair sem salvar?', `<p style="margin:0">Há <b>${plural(n, 'alteração', 'alterações')}</b> nesta tela que ainda não ${n === 1 ? 'foi salva' : 'foram salvas'}.</p>`, 'Descartar e sair', () => { est().vals = {}; irPara(tela, parte, true); }, 'Continuar editando');
  }
  atual = tela; sec = parte;
  history.replaceState(null, '', '#' + tela + (parte ? '/' + parte : ''));
  desenhar();
  window.scrollTo(0, 0);
}

function desenhar() {
  const T = TELAS[atual], s = S();
  const item = (k) => { const n = contaDe(TELAS[k].secoes[0]); return `<button class="sub" data-tela="${k}"${k === atual ? ' aria-current="page"' : ''}><span>${TELAS[k].menu}</span>${n != null ? `<i aria-hidden="true">${n}</i>` : ''}</button>`; };
  // Pedidos de produção fica no menu Tarefas (decisão do dono); as outras 12, em Configurações.
  $('#menuTarefas').innerHTML = item('ordens');
  $('#menu').innerHTML = ORDEM.filter((k) => k !== 'ordens').map(item).join('');
  $('#trilha').textContent = T.grupo || 'Configurações';
  $('#irPara').innerHTML = ORDEM.map((k) => `<option value="${k}"${k === atual ? ' selected' : ''}>${TELAS[k].grupo ? TELAS[k].grupo + ' › ' : ''}${TELAS[k].menu}</option>`).join('');
  $('#tituloTela').textContent = T.titulo || T.menu;
  const ss = $('#secoes');
  ss.hidden = T.secoes.length < 2;
  ss.innerHTML = T.secoes.map((p, i) => { const n = contaDe(p); return `<button class="aba" data-secao="${i}" aria-pressed="${i === sec}">${p.nome}${n != null ? ` <b>${n}</b>` : ''}</button>`; }).join('');
  $('#conteudo').innerHTML = (s.tipo === 'lista' ? htmlLista(s) : s.tipo === 'ajustes' ? htmlAjustes(s) : htmlLivre(s)) + (T.hoje ? `<details class="nota" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center">▸ O que muda nesta tela em relação a hoje</summary><ul style="margin:8px 0 0;padding-left:18px">${T.hoje.map((x) => `<li>${x}</li>`).join('')}</ul></details>` : '');
  barraSalvar();
}

// ── parte do tipo LISTA ──
function filtrar(s, e, semSit) {
  const b = sem(e.busca);
  return s.dados.filter((r) => (!b || sem(s.texto(r)).includes(b)) && (s.selects || []).every((f, i) => !e.sel[i] || valores(f, r).includes(e.sel[i])) && (semSit || e.sit < 0 || s.sits[e.sit][1](r)));
}
function htmlLista(s) {
  const e = est();
  const base = filtrar(s, e, true), lista = filtrar(s, e, false), total = s.dados.length;
  const qtd = (n) => plural(n, s.um, s.varios);
  const filtrando = e.busca || e.sit >= 0 || Object.values(e.sel).some(Boolean);
  const extra = s.resumo ? s.resumo(lista) : '';
  const fora = s.selecao ? [...e.marc].filter((r) => !lista.includes(r)).length : 0;
  return `
    <div class="barra">
      <div><h2 id="tLista" tabindex="-1">${s.titulo}</h2>
        <p class="resumo" role="status" aria-live="polite">${lista.length === total ? qtd(total) : `${lista.length} de ${qtd(total)}`}${extra ? ' · ' + extra : ''}</p></div>
      <div class="acoes">${(s.botoes || []).map((b, i) => `<button class="bt" data-botao="${i}">${b[0]}</button>`).join('')}${s.novo ? `<button class="bt pri" id="bNovo">${s.novo}</button>` : ''}</div>
    </div>
    ${typeof s.antes === 'function' ? s.antes() : s.antes || ''}
    <div class="sits" role="group" aria-label="Situação">
      <button class="sit" data-sit="-1" aria-pressed="${e.sit < 0}">${s.todas || 'Todas'} <b>${base.length}</b></button>
      ${s.sits.map((x, i) => `<button class="sit ${x[2] || ''}" data-sit="${i}" aria-pressed="${e.sit === i}">${x[0]} <b>${base.filter(x[1]).length}</b></button>`).join('')}
    </div>
    <div class="filtros">
      <div class="campo larga"><label for="fBusca">Buscar</label><input id="fBusca" type="search" value="${esc(e.busca)}" placeholder="${s.buscar || 'Digite parte do nome'}" autocomplete="off"></div>
      ${(s.selects || []).map((f, i) => `<div class="campo"><label for="fSel${i}">${f[0]}</label><select id="fSel${i}" data-sel="${i}"><option value="">${f[1]}</option>${[...new Set(s.dados.flatMap((r) => valores(f, r)))].sort((x, y) => String(x).localeCompare(String(y), 'pt-BR')).map((v) => `<option${e.sel[i] === v ? ' selected' : ''}>${v}</option>`).join('')}</select></div>`).join('')}
    </div>
    ${s.selecao ? `<div class="filtros" style="grid-template-columns:minmax(0,1fr) auto;align-items:center">
        <div><label style="display:inline-flex;align-items:center;gap:8px;min-height:40px;font-weight:600"><input type="checkbox" id="mTodos" style="width:20px;height:20px"${lista.length && lista.every((r) => e.marc.has(r)) ? ' checked' : ''}> Marcar ${lista.length === 1 ? 'o 1 da lista' : `os ${lista.length} da lista`}</label>
          <span class="ajuda" role="status"> · ${plural(e.marc.size, 'marcado', 'marcados')}${fora ? ` (${fora} fora do filtro atual)` : ''}</span>${e.marc.size ? ' <button class="bt" id="mNada">Desmarcar todos</button>' : ''}</div>
        <button class="bt pri" id="bSel"${e.marc.size ? '' : ' disabled'}>${s.selecao.rotulo}</button></div>` : ''}
    <div class="tabela cartoes">${lista.length ? `<table><caption class="sr">${s.titulo}</caption>
      <thead><tr>${s.colunas.map((c) => `<th scope="col">${c[0]}</th>`).join('')}<th scope="col"><span class="sr">Ações</span></th></tr></thead>
      <tbody>${lista.map((r) => { const i = s.dados.indexOf(r); const ac = s.acoes ? s.acoes(r) : []; return `<tr>${s.colunas.map((c, k) => `<td ${k === 0 ? 'class="c-nome"' : `data-rot="${c[0]}"`}><div class="v">${k === 0 && s.selecao ? `<label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" data-marc="${i}" style="width:20px;height:20px;flex:none;margin-top:2px"${e.marc.has(r) ? ' checked' : ''} aria-label="Marcar ${esc(s.rotulo ? s.rotulo(r) : r.nome)}"><span>${c[1](r, i)}</span></label>` : c[1](r, i)}</div></td>`).join('')}
        <td class="c-acoes">${ac.length ? `<div class="linha-acoes">${ac.map((x) => `<button class="ic ${x[3] || ''}" data-acao="${x[2]}" data-i="${i}" title="${x[1]}" aria-label="${x[1]}: ${esc(s.rotulo ? s.rotulo(r) : r.nome)}">${x[0]} <span class="rt">${x[1]}</span></button>`).join('')}</div>` : ''}</td></tr>`; }).join('')}</tbody></table>`
      : `<div class="vazio">${total === 0 ? s.vazio || 'Nenhum registro ainda.' : 'Nada com esses filtros. <button class="bt" id="bLimpar" style="margin-left:8px">Limpar filtros</button>'}</div>`}</div>
    ${filtrando && lista.length ? '<p style="margin:8px 2px 0"><button class="bt" id="bLimpar">Limpar filtros</button></p>' : ''}
    ${typeof s.depois === 'function' ? s.depois() : s.depois || ''}`;
}
// chave liga/desliga dentro de uma linha da lista (grava na hora, com retorno)
const ligaLinha = (r, i, campo, rot) => `<span style="display:inline-flex;align-items:center;gap:6px"><span class="liga-txt">${r[campo] ? 'Ligado' : 'Desligado'}</span><button class="liga" role="switch" aria-checked="${!!r[campo]}" data-liga="${campo}" data-i="${i}" aria-label="${esc(rot)}"></button></span>`;

// ── parte do tipo AJUSTES ──
const emBranco = (it, e) => it.tipo !== 'liga' && !it.opcional && String(valorAj(it, e)).trim() === '';
// [rótulo, filtro, classe, aparece só se a tela tiver: 'liga' = chaves · 'campo' = campos de texto]
const SITS_AJ = [['Ligados', (it, e) => it.tipo === 'liga' && valorAj(it, e) === true, '', 'liga'], ['Desligados', (it, e) => it.tipo === 'liga' && valorAj(it, e) === false, '', 'liga'], ['Em branco', emBranco, 'warn', 'campo'], ['Alterados, sem salvar', (it, e) => mudouAj(it, e), 'warn', '']];
function controle(it, e) {
  const v = valorAj(it, e), a = `data-aj="${it.id}" aria-labelledby="r-${it.id}"`;
  if (it.tipo === 'liga') return `<span class="liga-txt">${v ? 'Ligado' : 'Desligado'}</span><button class="liga" role="switch" aria-checked="${v}" ${a}></button>`;
  if (it.tipo === 'sel') return `<select ${a}>${it.ops.map((o) => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
  return `<input ${a} type="${it.tipo === 'num' ? 'number' : it.tipo === 'hora' ? 'time' : 'text'}" value="${esc(v)}"${it.tipo === 'num' ? ' min="0" inputmode="decimal"' : ''}>${it.suf ? `<span class="suf">${it.suf}</span>` : ''}`;
}
function htmlAjustes(s) {
  const e = est(), todos = itensAj(s), b = sem(e.busca);
  const casa = (it) => !b || sem(it.rot + ' ' + (it.ajuda || '')).includes(b);
  const base = todos.filter(casa);
  const ve = (it) => casa(it) && (e.sit < 0 || SITS_AJ[e.sit][1](it, e));
  const vis = todos.filter(ve).length, alt = todos.filter((it) => mudouAj(it, e)).length;
  const tem = { liga: todos.some((it) => it.tipo === 'liga'), campo: todos.some((it) => it.tipo !== 'liga' && !it.opcional), '': true };
  return `
    <div class="barra"><div><h2 id="tLista" tabindex="-1">${s.titulo}</h2>
      <p class="resumo" role="status" aria-live="polite" id="resumoAj">${vis === todos.length ? plural(todos.length, 'ajuste', 'ajustes') : `${vis} de ${plural(todos.length, 'ajuste', 'ajustes')}`} em ${plural(s.grupos.length, 'grupo', 'grupos')}${alt ? ` · ${plural(alt, 'alteração ainda não salva', 'alterações ainda não salvas')}` : ''}</p></div>
      <div class="acoes">${(s.botoes || []).map((x, i) => `<button class="bt" data-botao="${i}">${x[0]}</button>`).join('')}</div></div>
    ${typeof s.antes === 'function' ? s.antes() : s.antes || ''}
    <div class="sits" role="group" aria-label="Situação">
      <button class="sit" data-sit="-1" aria-pressed="${e.sit < 0}">Todos <b>${base.length}</b></button>
      ${SITS_AJ.map((x, i) => (!tem[x[3]] ? '' : `<button class="sit ${x[2]}" data-sit="${i}" aria-pressed="${e.sit === i}">${x[0]} <b data-conta="${i}">${base.filter((it) => x[1](it, e)).length}</b></button>`)).join('')}
    </div>
    <div class="filtros"><div class="campo larga"><label for="fBusca">Buscar ajuste</label><input id="fBusca" type="search" value="${esc(e.busca)}" placeholder="${s.buscar || 'Digite parte do nome do ajuste'}" autocomplete="off"></div></div>
    ${vis ? s.grupos.map((g) => { const its = g.itens.filter(ve); if (!its.length) return ''; const lg = g.itens.filter((it) => it.tipo === 'liga');
      return `<section class="grupo"><header><h3>${g.titulo}</h3><span>${lg.length ? `${lg.filter((it) => valorAj(it, e) === true).length} de ${lg.length} ligados` : plural(g.itens.length, 'ajuste', 'ajustes')}</span></header>
        ${g.nota ? `<div class="aj" style="grid-template-columns:minmax(0,1fr)"><span class="ajuda">${g.nota}</span></div>` : ''}
        ${its.map((it) => `<div class="aj${mudouAj(it, e) ? ' mudou' : ''}"><div><span class="rot-aj" id="r-${it.id}">${it.rot}</span>${it.ajuda ? `<span class="ajuda">${it.ajuda}</span>` : ''}</div><div class="ctrl">${controle(it, e)}</div></div>`).join('')}
        ${g.html ? `<div class="aj" style="grid-template-columns:minmax(0,1fr)">${typeof g.html === 'function' ? g.html(e) : g.html}</div>` : ''}</section>`; }).join('')
      : '<div class="tabela vazio">Nenhum ajuste com esses filtros. <button class="bt" id="bLimpar" style="margin-left:8px">Limpar filtros</button></div>'}
    ${typeof s.depois === 'function' ? s.depois() : s.depois || ''}`;
}
function barraSalvar() {
  const bar = $('#barraSalvar'), n = pendentes();
  bar.hidden = !n;
  bar.innerHTML = n ? `<span role="status" style="font-weight:700">${plural(n, 'alteração ainda não salva', 'alterações ainda não salvas')}</span><span class="acoes"><button class="bt" id="bDescartar">Descartar</button><button class="bt pri" id="bSalvar">Salvar alterações</button></span>` : '';
}

// ── parte do tipo LIVRE ──
function htmlLivre(s) {
  return `<div class="barra"><div><h2 id="tLista" tabindex="-1">${s.titulo}</h2><p class="resumo" role="status" aria-live="polite">${typeof s.resumo === 'function' ? s.resumo() : s.resumo || ''}</p></div>
    <div class="acoes">${(s.botoes || []).map((x, i) => `<button class="bt${x[2] ? ' ' + x[2] : ''}" data-botao="${i}">${x[0]}</button>`).join('')}</div></div>${s.desenhar()}`;
}

// ── cliques e digitação ──
function refocar(sel) { const n = $(sel); if (n) n.focus(); }
document.addEventListener('click', (ev) => {
  const t = ev.target;
  if (t.closest('[data-fechar]')) return fechar();
  if (aberto && aberto.contains(t)) { // dentro de gaveta ou diálogo: só os controles genéricos
    const l = t.closest('button.liga'); if (l) { const v = l.getAttribute('aria-checked') !== 'true'; l.setAttribute('aria-checked', String(v)); const x = l.previousElementSibling; if (x && x.classList.contains('liga-txt')) x.textContent = v ? 'Ligado' : 'Desligado'; }
    const f = t.closest('.ficha, .seg button'); if (f) { if (f.parentElement.classList.contains('seg')) $$('button', f.parentElement).forEach((x) => x.setAttribute('aria-pressed', String(x === f))); else f.setAttribute('aria-pressed', String(f.getAttribute('aria-pressed') !== 'true')); }
    return;
  }
  const tela = t.closest('[data-tela]'); if (tela) return irPara(tela.dataset.tela, 0);
  const parte = t.closest('[data-secao]'); if (parte) return irPara(atual, Number(parte.dataset.secao));
  const sit = t.closest('[data-sit]'); if (sit) { const e = est(), n = Number(sit.dataset.sit); e.sit = e.sit === n ? -1 : n; desenhar(); return refocar(`[data-sit="${e.sit}"]`); }
  if (t.id === 'bLimpar') { const e = est(); e.busca = ''; e.sit = -1; e.sel = {}; desenhar(); return refocar('#fBusca'); }
  if (t.id === 'bNovo') return S().aoNovo();
  if (t.id === 'bSel') return S().selecao.ao([...est().marc]);
  if (t.id === 'mNada') { est().marc.clear(); return desenhar(); }
  if (t.id === 'bDescartar') { est().vals = {}; desenhar(); avisar('Alterações descartadas.'); return refocar('#tLista'); }
  if (t.id === 'bSalvar') { const e = est(), s = S(); for (const it of itensAj(s)) if (it.id in e.vals) it.v = e.vals[it.id]; e.vals = {}; desenhar(); avisar(s.salvou || 'Ajustes salvos.'); return refocar('#tLista'); }
  const bo = t.closest('[data-botao]'); if (bo) return S().botoes[Number(bo.dataset.botao)][1]();
  const ac = t.closest('[data-acao]'); if (ac) return S().aoAcao(ac.dataset.acao, S().dados[Number(ac.dataset.i)]);
  const lg = t.closest('[data-liga]'); if (lg) { const s = S(), r = s.dados[Number(lg.dataset.i)], c = lg.dataset.liga; r[c] = !r[c]; desenhar(); avisar(s.aoLigar ? s.aoLigar(r, c) : 'Salvo.'); return refocar(`[data-liga="${c}"][data-i="${lg.dataset.i}"]`); }
  const aj = t.closest('button.liga[data-aj]'); if (aj) { const e = est(); const it = itensAj(S()).find((x) => x.id === aj.dataset.aj); e.vals[it.id] = !valorAj(it, e); desenhar(); return refocar(`button.liga[data-aj="${it.id}"]`); }
  S().aoClicar?.(ev);
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'irPara') return irPara(t.value, 0);
  if (t.id === 'mTodos') { const e = est(), s = S(), lista = filtrar(s, e, false); lista.forEach((r) => (t.checked ? e.marc.add(r) : e.marc.delete(r))); desenhar(); return refocar('#mTodos'); }
  if (t.dataset.marc !== undefined && !aberto) { const e = est(), r = S().dados[Number(t.dataset.marc)]; t.checked ? e.marc.add(r) : e.marc.delete(r); desenhar(); return refocar(`[data-marc="${t.dataset.marc}"]`); }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (aberto && aberto.contains(t)) return S().aoDigitarNoPainel?.(ev);
  if (t.id === 'fBusca') { est().busca = t.value; desenhar(); const n = $('#fBusca'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); return; }
  if (t.dataset.sel !== undefined) { est().sel[t.dataset.sel] = t.value; desenhar(); return refocar(`#fSel${t.dataset.sel}`); }
  if (t.dataset.aj !== undefined && t.tagName !== 'BUTTON') { // campo de ajuste: não redesenha (a pessoa está digitando)
    const e = est(), s = S(), it = itensAj(s).find((x) => x.id === t.dataset.aj);
    e.vals[it.id] = it.tipo === 'num' ? (t.value === '' ? '' : Number(t.value)) : t.value;
    t.closest('.aj').classList.toggle('mudou', mudouAj(it, e));
    SITS_AJ.forEach((x, i) => { const b = $(`[data-conta="${i}"]`); if (b) b.textContent = itensAj(s).filter((y) => x[1](y, e)).length; });
    const alt = itensAj(s).filter((x) => mudouAj(x, e)).length, rs = $('#resumoAj'); if (rs) rs.textContent = rs.textContent.replace(/ · \d+ alteraç.*$/, '') + (alt ? ` · ${plural(alt, 'alteração ainda não salva', 'alterações ainda não salvas')}` : '');
    barraSalvar(); s.aoAjustar?.(e);
  }
});

// ── painéis (gaveta e diálogo): o foco entra, fica preso, Esc fecha, o foco volta ──
let aberto = null, quemAbriu = null;
function painel({ titulo, corpo, rodape, tipo = 'dialogo', largo = false, alerta = false, foco }) {
  const volta = aberto ? quemAbriu : document.activeElement;
  if (aberto) { $('#painel').innerHTML = ''; aberto = null; }
  quemAbriu = volta;
  $('#painel').innerHTML = `<div class="painel ${tipo === 'gaveta' ? 'gaveta' + (largo ? ' larga' : '') : 'dialogo' + (largo ? ' largo' : '')}" role="${alerta ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="pTit">
    <header><h3 id="pTit">${titulo}</h3><button class="ic" data-fechar aria-label="Fechar">✕</button></header><div class="corpo">${corpo}</div><footer>${rodape}</footer></div>`;
  aberto = $('#painel').firstElementChild; $('#fundo').hidden = false;
  (foco ? $(foco, aberto) : $$('.corpo input, .corpo select, .corpo textarea', aberto).find((x) => !x.disabled) || $('footer button', aberto))?.focus();
}
function fechar() { if (!aberto) return; $('#painel').innerHTML = ''; aberto = null; $('#fundo').hidden = true; if (quemAbriu && document.contains(quemAbriu)) quemAbriu.focus(); else refocar('#tLista'); }
document.addEventListener('keydown', (e) => {
  if (!aberto) return;
  if (e.key === 'Escape') return fechar();
  if (e.key !== 'Tab') return;
  const f = $$('button,input,select,textarea', aberto).filter((x) => !x.disabled && x.offsetParent !== null);
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
let nCampo = 0;
const campo = (rot, html, ajuda = '') => { const id = 'c' + ++nCampo; return `<div class="campo"><label for="${id}">${rot}</label>${html.replace(/^<(input|select|textarea)/, `<$1 id="${id}"`)}${ajuda ? `<span class="ajuda">${ajuda}</span>` : ''}</div>`; };
const sel = (ops, v = '') => `<select>${ops.map((o) => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
const chave = (rot, ligado, ajuda = '') => `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center"><div><span class="rot-aj" style="font-weight:600">${rot}</span>${ajuda ? `<span class="ajuda" style="display:block">${ajuda}</span>` : ''}</div><span style="display:inline-flex;align-items:center;gap:6px"><span class="liga-txt">${ligado ? 'Ligado' : 'Desligado'}</span><button type="button" class="liga" role="switch" aria-checked="${!!ligado}" aria-label="${esc(rot)}"></button></span></div>`;
const rodapeSalvar = (t, msg) => `<button class="bt" data-fechar>Cancelar</button><button class="bt pri" onclick="fechar();avisar('${msg}')">${t}</button>`;
function confirmar(titulo, corpo, botao, fn, cancelar = 'Cancelar', perigo = false) {
  painel({ titulo, corpo, alerta: true, rodape: `<button class="bt" data-fechar>${cancelar}</button><button class="bt ${perigo ? 'perigo' : 'pri'}" id="bOk">${botao}</button>`, foco: 'footer button' });
  $('#bOk').onclick = () => { fechar(); fn(); };
}
// excluir/revogar: diz a consequência e, depois, o foco vai para o título (a linha saiu da lista)
function confirmarRetirar(r, { titulo = 'Excluir', verbo = 'Excluir', nome = r.nome, consequencia, depois = 'Excluído.', fazer }) {
  painel({ titulo, alerta: true, foco: 'footer button', corpo: `<p style="margin:0">${verbo} <b>${nome}</b>?</p><div class="nota crit">${consequencia}</div>`,
    rodape: `<button class="bt" data-fechar>Cancelar</button><button class="bt perigo" id="bExc">${verbo}</button>` });
  $('#bExc').onclick = () => { const s = S(); fazer ? fazer() : (s.dados = s.dados.filter((x) => x !== r)); $('#painel').innerHTML = ''; aberto = null; $('#fundo').hidden = true; desenhar(); avisar(depois); refocar('#tLista'); };
}

      acesso('Liame', 'Marketing e tráfego pago', 'Filial Shopping', 'Pedidos e clientes', 'Carlos Exemplo', '', false, 'Revogado por Carlos Exemplo, em 28/09/2026'),
    ],
    texto: (r) => r.nome + ' ' + r.loja,
    resumo: () => 'ferramentas que leem dados das suas lojas com a sua autorização · você revoga quando quiser',
    sits: [['Ativos', (r) => r.ativo], ['Ainda não acessaram', (r) => r.ativo && !r.visto, 'warn'], ['Revogados', (r) => !r.ativo]],
    selects: [['Aplicativo', 'Todos os aplicativos', (r) => r.nome], ['Loja', 'Todas as lojas', (r) => r.loja]],
    colunas: [
      ['Aplicativo', (r) => `<span class="nome">${r.nome}</span><div class="sub-t">${r.desc}</div>`], ['Loja', (r) => r.loja], ['Recebe', (r) => r.recebe], ['Autorizado por', (r) => r.por],
      ['Último acesso', (r) => (r.ativo ? r.visto || 'Ainda não acessou' : r.fim)], ['Situação', (r) => (r.ativo ? selo('ok', 'ativo') : selo('neutro', 'revogado'))],
    ],
    acoes: (r) => (r.ativo ? [['⛔', 'Revogar', 'revogar', 'perigo']] : []),
    aoAcao(k, r) {
      painel({ titulo: `Revogar o ${r.nome} ${r.loja === 'todas as lojas' ? 'em todas as lojas' : 'na ' + r.loja}?`, alerta: true, foco: 'footer button',
        corpo: `<p style="margin:0">O ${r.nome} para de ler os dados ${r.loja === 'todas as lojas' ? 'de todas as lojas' : 'desta loja'} agora. O que ele já leu segue o prazo de guarda de lá. Para voltar, é preciso autorizar de novo pelo ${r.nome}.</p>`,
        rodape: `<button class="bt" data-fechar>Manter</button><button class="bt perigo" id="bRev">Revogar</button>` });
      $('#bRev').onclick = () => { r.ativo = false; r.fim = 'Revogado por você, agora'; $('#painel').innerHTML = ''; aberto = null; $('#fundo').hidden = true; desenhar(); avisar(`Revogado. O ${r.nome} não lê mais ${r.loja === 'todas as lojas' ? 'nenhuma loja' : 'a ' + r.loja}.`); refocar('#tLista'); };
    },
  }],
};

// ── 13. Servidor local ──
const SRV = { filtro: -1 };
const ITENS_SRV = [
  ['Servidor', 'online', true, 'O servidor da loja está respondendo.', ''],
  ['Último backup', 'hoje às 03:10', true, 'Cópia de 412 MB.', ''],
  ['Espaço livre no computador', '38,2 GB', true, 'Aviso quando ficar abaixo de 2 GB.', ''],
  ['Atualização do servidor', 'versão 1.30.2 · nova disponível: 1.30.3', false, 'O que muda: correções na impressão e no estoque.', 'atualizar'],
  ['App autenticador (anti-clone)', 'trava ligada (app)', true, 'App já cadastrado.', 'autenticador'],
  ['Restaurar do estado da nuvem', 'última restauração: nunca', true, 'Refaz os dados da loja a partir da nuvem. Faça com a loja parada.', 'restaurar'],
];
TELAS.servidor = {
  menu: 'Servidor local',
  hoje: ['Não é lista: continua sendo o painel de saúde. O que entra é o resumo no título ("5 de 6 em dia · 1 pede atenção") e as fichas que filtram o que pede atenção.', 'Instalar, reverter e restaurar saem da janela do navegador para diálogos, com o aviso inteiro que hoje aparece nela.', 'As mensagens de cada cartão, hoje em texto cinza no rodapé, viram avisos visíveis.', 'O painel mostra "carregando" e o erro de carga — hoje o cartão de saúde simplesmente some.', 'Tudo o mais continua: progresso da atualização com os 12 estágios, "não feche esta tela", agendar, QR do autenticador, instalador.'],
  secoes: [{
    nome: 'Servidor', tipo: 'livre', titulo: 'Servidor da loja', conta: () => ITENS_SRV.filter((x) => !x[2]).length || null,
    resumo: () => { const ok = ITENS_SRV.filter((x) => x[2]).length; return `${ok} de ${ITENS_SRV.length} em dia · ${plural(ITENS_SRV.length - ok, 'item pede atenção', 'itens pedem atenção')}`; },
    desenhar() {
      const lista = ITENS_SRV.filter((x) => SRV.filtro < 0 || (SRV.filtro === 0 ? !x[2] : x[2]));
      const BT = { atualizar: `<button class="bt" data-srv="verificar">Verificar atualização</button><button class="bt pri" data-srv="instalar">Instalar agora</button><button class="bt" data-srv="agendar">Agendar</button><button class="bt" data-srv="reverter">Reverter atualização</button>`,
        autenticador: `<button class="bt" data-srv="qr">Gerar novo QR</button>`, restaurar: `<button class="bt perigo" data-srv="restaurar">Restaurar agora</button>` };
      return `<div class="sits" role="group" aria-label="Situação"><button class="sit" data-fsrv="-1" aria-pressed="${SRV.filtro < 0}">Tudo <b>${ITENS_SRV.length}</b></button><button class="sit warn" data-fsrv="0" aria-pressed="${SRV.filtro === 0}">Pede atenção <b>${ITENS_SRV.filter((x) => !x[2]).length}</b></button><button class="sit" data-fsrv="1" aria-pressed="${SRV.filtro === 1}">Em dia <b>${ITENS_SRV.filter((x) => x[2]).length}</b></button></div>
        ${lista.map((x) => `<section class="grupo"><header><h3>${x[0]}</h3>${selo(x[2] ? 'ok' : 'warn', x[2] ? 'em dia' : 'pede atenção')}</header><div class="aj" style="grid-template-columns:minmax(0,1fr)"><div><span class="num" style="font-size:15px;font-weight:700;white-space:normal">${x[1]}</span><span class="ajuda">${x[3]}</span></div>${x[4] ? `<div class="acoes">${BT[x[4]]}</div>` : ''}</div></section>`).join('')}
        <section class="grupo"><header><h3>Suporte / diagnóstico</h3></header><div class="aj" style="grid-template-columns:minmax(0,1fr) auto"><span class="ajuda">Manda os registros do servidor para a equipe de suporte analisar.</span><button class="bt" data-srv="logs">Enviar logs pro suporte</button></div></section>
        <section class="grupo"><header><h3>Instale o Regem na sua loja</h3></header><div class="aj" style="grid-template-columns:minmax(0,1fr) auto"><span class="ajuda">Instalador para Windows, com os 3 passos e o "Antes de começar" de hoje.</span><button class="bt" data-srv="baixar">Baixar o instalador (Windows)</button></div></section>`;
    },
    aoClicar(ev) {
      const f = ev.target.closest('[data-fsrv]'); if (f) { SRV.filtro = Number(f.dataset.fsrv); desenhar(); return refocar(`[data-fsrv="${SRV.filtro}"]`); }
      const b = ev.target.closest('[data-srv]'); if (!b) return;
      const k = b.dataset.srv, aviso = '<div class="nota warn">Aqui entra, inteiro, o aviso que hoje aparece na janela do navegador.</div>';
      if (k === 'instalar') return confirmar('Instalar a versão 1.30.3 agora?', `<p style="margin:0">Agora: <b>2 caixas abertos e 3 pedidos em produção</b>. Os serviços ficam fora por 1 a 2 minutos.</p>${aviso}`, 'Instalar agora mesmo assim', () => avisar('Instalação iniciada. Não feche esta tela.'), 'Agendar para depois do fechamento', true);
      if (k === 'reverter') return confirmar('Reverter a última atualização?', aviso, 'Reverter', () => avisar('Reversão iniciada. Não feche esta tela.'), 'Cancelar', true);
      if (k === 'restaurar') return confirmar('Restaurar do estado da nuvem?', `<p style="margin:0">Faça com a loja parada.</p>${aviso}`, 'Restaurar agora', () => avisar('Restauração na fila.'), 'Cancelar', true);
      if (k === 'agendar') return painel({ titulo: 'Agendar a instalação', rodape: rodapeSalvar('Confirmar agendamento', 'Instalação agendada para hoje, 23:30.'), corpo: campo('Instalar em', '<input type="datetime-local" value="2026-10-07T23:30">') });
      avisar({ verificar: 'Você já está com a versão mais recente liberada para esta loja.', qr: 'Aqui aparecem o QR, a chave em texto e o campo "Código do app".', logs: 'Logs enviados para o suporte.', baixar: 'Download do instalador iniciado.' }[k]);
    },
  }],
};

// ── partida ──
(function iniciar() {
  const [t, p] = location.hash.slice(1).split('/');
  if (TELAS[t]) { atual = t; sec = Math.min(Number(p) || 0, TELAS[t].secoes.length - 1); }
  desenhar();
})();

</script>
</body>
