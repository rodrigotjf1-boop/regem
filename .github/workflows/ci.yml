name: CI

# Portão de qualidade: roda em todo push e PR. O merge em main só deve ocorrer
# com este workflow verde (configurar branch protection em main — ver CLAUDE.md).
on:
  push:
  pull_request:

jobs:
  build:
    name: build & test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    # Postgres para os testes que precisam rodar SQL de verdade (ex.: fila de impressão —
    # a 1.29.0 saiu com a consulta do worker quebrada e nenhum teste a executava).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        dir: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Versão EXATA, igual à dos Dockerfiles: "24" pegaria a versão que estiver guardada no executor, que pode ser
      # anterior à correção do boletim do Node de 21/10/2026 (Brotli, CVE-2026-111497).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Versão do Node
        run: node -v

      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build
        env:
          # Necessário para o build do Next embutir a URL (valor placeholder no CI).
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1

      # Banco COMPLETO como numa instalação nova do servidor local: todas as migrations num
      # Postgres vazio (o mesmo runner do instalador, EDGE_MODE=true). Também pega migration que
      # quebra instalação nova. Usado pelos testes que rodam SQL de verdade (fila e roteamento
      # da impressão).
      - name: Banco de teste (todas as migrations)
        if: matrix.dir == 'backend'
        working-directory: backend
        run: |
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client({connectionString:'postgresql://postgres:postgres@localhost:5432/postgres'});await c.connect();await c.query('create database regem_ci');await c.end()})()"
          node scripts/apply-all-local.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/regem_ci
          EDGE_MODE: 'true'

      # O kit de conformidade do Padrão DMS (Hub DMS, em dms-id.http.spec.ts) roda direto no Node 24 (TypeScript sem
      # compilar), dentro deste passo; com KIT_DMS_OBRIGATORIO, se ele fosse pulado, seria falha.
      - name: Test (se existir)
        working-directory: ${{ matrix.dir }}
        run: npm test --if-present
        env:
          TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/regem_ci
          KIT_DMS_OBRIGATORIO: 'true'

      # Só quando o backend falha: o log do Postgres do serviço. Num impasse ("deadlock detected"), a spec que caiu só
      # recebe a instrução DELA; o servidor registra as duas — é ali que se vê quem estava do outro lado (ERR-377).
      - name: Log do Postgres (quando falha)
        if: failure() && matrix.dir == 'backend'
        run: |
          docker logs "${{ job.services.postgres.id }}" > pg.log 2>&1 || true
          if grep -q 'deadlock detected' pg.log; then grep -B 2 -A 14 'deadlock detected' pg.log | head -n 300; else tail -n 80 pg.log; fi

  # O programa da ponte do chat (ponte-chat/, Electron): os testes dos módulos que não dependem do Electron (o leitor do
  # chat, a fila, a nuvem, o diagnóstico, a configuração) — sem npm ci (não precisam de pacote; nada de baixar o Electron).
  ponte-chat:
    name: ponte do chat (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Testes
        working-directory: ponte-chat
        run: node --test "test/*.test.js"
