name: regem_entregador
description: App do Entregador — Regem (Trilha B).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # E1 (scan): leitor de QR/código de barras on-device.
  mobile_scanner: ^5.1.1
  # E2 (GPS): localização durante a entrega ativa.
  geolocator: ^13.0.0
  # E3 (rotas): abrir o endereço no Waze/Google Maps.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
