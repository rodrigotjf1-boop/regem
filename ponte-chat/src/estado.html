<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Estado da ponte · Regem · Ponte do chat</title>
<style>
  :root { --tinta: #0F2230; --base: #EDF0F4; --ouro: #E2A340; --ok: #0E7C66; --aviso: #8A5A00; --erro: #B42318; --cinza: #4A5A68; --borda: #C9D2DB; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--base); color: var(--tinta); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 16px; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 30px rgba(15,34,48,.12); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  h1 { margin: 0; font-size: 20px; }
  .sub { flex-basis: 100%; margin: 0; color: var(--cinza); font-size: 13px; overflow-wrap: anywhere; }
  .selo { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; border: 1px solid var(--borda); }
  .selo.ok { background: #E3F2EE; border-color: #9CCFC2; color: var(--tinta); }
  .selo.aviso { background: #FFF2D6; border-color: #E9C46A; color: var(--tinta); }
  .selo.neutro { background: #F1F4F7; color: var(--tinta); }
  .faixa { margin: 14px 0 0; border-radius: 8px; border-left: 4px solid var(--borda); padding: 8px 12px; background: #F6F8FA; }
  .faixa.aviso { border-left-color: #E2A340; background: #FFF8E8; }
  .faixa p { margin: 0; overflow-wrap: anywhere; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 16px 0 0; }
  dt { font-weight: 700; }
  dd { margin: 0; color: var(--tinta); overflow-wrap: anywhere; }
  @media (max-width: 420px) { dl { grid-template-columns: 1fr; } dd { margin-bottom: 6px; } }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  button { min-height: 40px; padding: 0 14px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; color: var(--tinta);
           font: 600 14px "Segoe UI", system-ui, sans-serif; cursor: pointer; }
  button.pri { background: var(--ouro); border-color: var(--ouro); }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
  #msg { min-height: 1.5em; margin: 10px 0 0; font-size: 14px; }
  .nota { margin: 14px 0 0; color: var(--cinza); font-size: 13px; }
  #versao { color: var(--cinza); font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ponte do chat</h1>
    <span id="selo" class="selo neutro" role="status" aria-live="polite">…</span>
    <p id="sub" class="sub"></p>
  </header>
  <div id="faixa" class="faixa" role="status" aria-live="polite" hidden></div>
  <dl id="pares" aria-label="Situação da ponte neste PC"></dl>
  <div id="acoes" class="acoes"></div>
  <p id="msg" role="status" aria-live="polite"></p>
  <p class="nota">Fechar esta janela deixa a ponte rodando no ícone perto do relógio. <span id="versao"></span></p>
</main>
<script src="estado-janela.js"></script>
</body>
</html>
